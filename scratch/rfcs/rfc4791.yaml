---
rfc: 4791
title: "CalDAV: Calendaring Extensions to WebDAV"
spec_url: "https://datatracker.ietf.org/doc/html/rfc4791"
sections:
  - id: "5.1"
    title: "DAV Header Compliance"
    requirements:
      - id: "REQ-4791-5.1-1"
        summary: "Must advertise 'calendar-access' feature tag in OPTIONS DAV response header."
        status: "implemented"
        details: "CalDavRouter responds with 'DAV: 1, calendar-access' header on OPTIONS and WebDAV requests."

  - id: "5.2"
    title: "Calendar Resource and Collection Properties"
    requirements:
      - id: "REQ-4791-5.2.1"
        summary: "Must define <CALDAV:calendar/> resourcetype element for calendar collections."
        status: "implemented"
        details: "PROPFIND responses output <d:resourcetype><d:collection/><c:calendar/></d:resourcetype>."

      - id: "REQ-4791-5.2.3"
        summary: "Must advertise CALDAV:supported-calendar-component-set property."
        status: "implemented"
        details: "Returns VEVENT, VTODO, and VJOURNAL component types inside PROPFIND propstat."

      - id: "REQ-4791-5.2.5"
        summary: "Must advertise CALDAV:max-resource-size property."
        status: "implemented"
        details: "Returns 10485760 (10MB) maximum payload size in PROPFIND propstat."

  - id: "5.3"
    title: "Creating Calendar Collections (MKCALENDAR)"
    requirements:
      - id: "REQ-4791-5.3.1"
        summary: "Must support MKCALENDAR HTTP method to create calendar collections."
        status: "implemented"
        details: "CalDavRouter handles MKCALENDAR method and creates new calendar collection."

      - id: "REQ-4791-5.3.2"
        summary: "Must evaluate ETag and If-Match preconditions during resource modification."
        status: "implemented"
        details: "PUT and DELETE methods check If-Match ETags to prevent concurrent write overwrites."

  - id: "6.2"
    title: "Principal Discovery Properties"
    requirements:
      - id: "REQ-4791-6.2.1"
        summary: "Must advertise CALDAV:calendar-home-set property on principal resources."
        status: "implemented"
        details: "Returns calendar home URI path (e.g. '/calendars/user/') on PROPFIND of principal."

      - id: "REQ-4791-6.2.2"
        summary: "Must advertise CALDAV:calendar-user-address-set property."
        status: "implemented"
        details: "Returns user mailto address URIs for calendar scheduling identity discovery."

  - id: "7.8"
    title: "calendar-query REPORT"
    requirements:
      - id: "REQ-4791-7.8.1"
        summary: "Must parse <CALDAV:calendar-query> REPORT request XML body."
        status: "implemented"
        details: "parse_calendar_query parses comp-filter, time-range, and property list."

      - id: "REQ-4791-7.8.2"
        summary: "Must evaluate component name and UTC time-range filter conditions."
        status: "implemented"
        details: "matches_comp_filter recursively evaluates VEVENT time-range start and end boundaries."

      - id: "REQ-4791-7.8.3"
        summary: "Must return 207 Multi-Status XML response containing matching calendar resources."
        status: "implemented"
        details: "build_report_response formats matching items with ETags and raw .ics payloads."

  - id: "7.9"
    title: "calendar-multiget REPORT"
    requirements:
      - id: "REQ-4791-7.9.1"
        summary: "Must parse <CALDAV:calendar-multiget> REPORT containing explicit href elements."
        status: "implemented"
        details: "parse_calendar_multiget extracts target href paths from request XML."

      - id: "REQ-4791-7.9.2"
        summary: "Must batch-fetch requested calendar resources by href path."
        status: "implemented"
        details: "Returns requested resources in a single 207 Multi-Status response."

  - id: "7.10"
    title: "free-busy-query REPORT"
    requirements:
      - id: "REQ-4791-7.10.1"
        summary: "Must parse <CALDAV:free-busy-query> REPORT and calculate VFREEBUSY components."
        status: "not_implemented"
        details: "Free-busy query REPORT is not yet implemented."
