---
rfc: 6578
title: "WebDAV Collection Synchronization"
spec_url: "https://datatracker.ietf.org/doc/html/rfc6578"
sections:
  - id: "3.1"
    title: "sync-collection REPORT Request"
    requirements:
      - id: "REQ-6578-3.1-1"
        summary: "Must parse <DAV:sync-collection> REPORT request containing <DAV:sync-token> element."
        status: "implemented"
        maturity: "production_grade"
        details: "parse_sync_collection parses sync_token string and optional limit parameters; verified by compliance test suite."

  - id: "3.2"
    title: "sync-collection REPORT Response"
    requirements:
      - id: "REQ-6578-3.2-1"
        summary: "Must return 207 Multi-Status XML response containing updated resource ETags."
        status: "implemented"
        maturity: "production_grade"
        details: "build_report_response constructs Multi-Status XML containing href and getetag for modified items; verified by compliance suite."

      - id: "REQ-6578-3.2-2"
        summary: "Must include deleted resource tombstones with 404 HTTP status responses in sync diff payload."
        status: "implemented"
        maturity: "production_grade"
        details: "Tombstone tracking on deletion implemented in SQLiteStore and MemoryStore; verified by RFC 6578 compliance tests."

  - id: "3.7"
    title: "Truncation and Pagination (<DAV:limit>)"
    requirements:
      - id: "REQ-6578-3.7-1"
        summary: "Must parse <DAV:limit><DAV:nresults> element in sync-collection REPORT requests."
        status: "implemented"
        maturity: "production_grade"
        details: "SyncCollectionRequest and parse_sync_collection parse integer nresults limit; verified by compliance suite."

      - id: "REQ-6578-3.7-2"
        summary: "Must support multi-page token pagination and return intermediate sync tokens when results are truncated."
        status: "not_implemented"
        maturity: "not_implemented"
        details: "Server currently truncates result array but does not emit intermediate page tokens for multi-page iteration."

  - id: "6.1"
    title: "DAV:sync-token Property"
    requirements:
      - id: "REQ-6578-6.1-1"
        summary: "Must advertise DAV:sync-token property on collection resources."
        status: "implemented"
        maturity: "production_grade"
        details: "PROPFIND responses output <DAV:sync-token> element containing URI formatted state token; verified by RFC 6578 compliance tests."
