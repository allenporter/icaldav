---
rfc: 5397
title: "WebDAV Current Principal Extension"
spec_url: "https://datatracker.ietf.org/doc/html/rfc5397"
sections:
  - id: "3"
    title: "DAV:current-user-principal Property"
    requirements:
      - id: "REQ-5397-3-1"
        summary: "Must advertise DAV:current-user-principal property on DAV resources."
        status: "partially_implemented"
        maturity: "prototype"
        details: "PROPFIND responses return current-user-principal href; relies on InMemoryPrincipalStore default."

      - id: "REQ-5397-3-2"
        summary: "Must return <DAV:unauthenticated/> element when request is unauthenticated."
        status: "implemented"
        maturity: "prototype"
        details: "PROPFIND returns unauthenticated principal tag if user session is anonymous; awaiting litmus validation."
