---
rfc: 5397
title: "WebDAV Current Principal Extension"
spec_url: "https://datatracker.ietf.org/doc/html/rfc5397"
sections:
  - id: "3"
    title: "DAV:current-user-principal Property"
    requirements:
      - id: "REQ-5397-3-1"
        summary: "Must advertise DAV:current-user-principal property on DAV resources."
        status: "implemented"
        details: "PROPFIND responses return <DAV:current-user-principal><DAV:href>/principals/user/</DAV:href></DAV:current-user-principal>."

      - id: "REQ-5397-3-2"
        summary: "Must return <DAV:unauthenticated/> element when request is unauthenticated."
        status: "implemented"
        details: "PROPFIND returns unauthenticated principal tag if user session is anonymous."
