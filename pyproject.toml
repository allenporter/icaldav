[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0"]

[project]
name = "icaldav"
version = "0.0.2"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "icaldav transforms CalDAV into a fast, reliable local synchronization pipeline. By pairing ical's data processing power with a modern asyncio sync engine and embeddable server router, icaldav completes the Python calendar ecosystem."
readme = "README.md"
authors = [{ name = "Allen Porter", email = "allen.porter@gmail.com" }]
requires-python = ">=3.12"
classifiers = []
dependencies = [
  "aiohttp>=3.10.0",
  "mashumaro>=3.14.0",
]

[project.urls]
Source = "https://github.com/allenporter/icaldav"

[project.scripts]
icaldav = "icaldav.cli:main"

[tool.setuptools.packages.find]
include = ["icaldav*"]

[tool.mypy]
exclude = [
  "venv/",
]
platform = "linux"
show_error_codes = true
follow_imports = "normal"
local_partial_types = true
strict_equality = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
disable_error_code = [
    "import-untyped",
]
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
